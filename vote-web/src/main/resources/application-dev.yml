# ============================================================
# 本地开发环境：连接本机 MySQL / Redis / RabbitMQ
#   启动方式：默认即为 dev（application.yml 中 spring.profiles.active 默认 dev）
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/vote_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin

  # 演示数据只在开发环境灌入。
  # 表结构由 Flyway 管理（spring.flyway.locations），此处只指定数据脚本；
  # 生产的 spring.sql.init.mode 默认为 embedded（MySQL 非嵌入式），不会执行。
  sql:
    init:
      mode: always
      data-locations: classpath:db/dev-seed.sql
      # 演示数据已用 INSERT IGNORE，失败也不应影响启动
      continue-on-error: true

mybatis-plus:
  configuration:
    # 开发期打印 SQL，便于排查；生产环境改用 NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoint:
    health:
      show-details: always

app:
  security:
    # 本地调试允许用 X-User-Id 模拟登录用户，无需先走登录流程
    trust-client-user-id: true

logging:
  level:
    com.vote: debug
